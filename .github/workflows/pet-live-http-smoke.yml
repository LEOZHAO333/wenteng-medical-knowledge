name: Pet live public HTTP SEO smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'pet-site/seo/check-live-public-http.mjs'
      - '.github/workflows/pet-live-http-smoke.yml'

permissions:
  contents: read

jobs:
  read-only-public-HTTP:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read-only checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Inspect actual pet.japanmedai.com HTTP responses and SEO metadata
        run: |
          node --version
          node pet-site/seo/check-live-public-http.mjs
