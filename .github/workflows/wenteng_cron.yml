name: JapanMed AI 医疗情报抓取

on:
  schedule:
    # 每天北京时间 09:00（东京时间 10:00）
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  wake-up-coze:
    runs-on: ubuntu-latest
    steps:
      - name: 触发 JapanMed AI 医疗情报工作流
        run: |
          curl -X POST 'https://jhp45hh6sc.coze.site/run' \
            -H 'Authorization: ${{ secrets.COZE_API_TOKEN }}' \
            -H 'Content-Type: application/json' \
            -d '{"keywords":["二次专家会诊","精密体检","BNCT","iPS细胞","日本新药","日本临床研究","日本汉方"]}'
